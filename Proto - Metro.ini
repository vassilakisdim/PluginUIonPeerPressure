[Devkit]

; This will make a title of your choice the dashboard!
; Absolute paths must be used unless you use a valid symbolic link name
; Mainly created for use on devkits, this does not change the dashboard that loads on boot!
customDash = false
customDashPath = Usb:\NXE\dash.xex

; This will only load plugins beside Proto.xex
; Example: plugin1 = menu.xex
plugin1 = 
plugin2 = 
plugin3 = 
plugin4 = 
plugin5 = 


[General]
protoHud = false
disableHudRestriction = true
disableOnlinePresence = false
backgroundDownloadPatch = false
halosunrise = false


[Enforced DNS]

By default DNS will only be enforced if a static primary DNS of 0.0.0.0 is detected.
This option forces it for any DNS values.
AlwaysEnforce = false

The primary DNS server to be used when Proto loads
Primary = 1.1.1.1

The Secondary DNS server to be used when Proto loads
Secondary = 1.0.0.1
